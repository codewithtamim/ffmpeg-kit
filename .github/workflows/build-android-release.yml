name: Build Android AAR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v6.0.2-full-gpl-lts)'
        required: true
        type: string
      ffmpeg_kit_ref:
        description: 'Git ref to build from (e.g., main, development, or a tag)'
        required: true
        default: 'main'
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      ANDROID_PATCH_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ffmpeg_kit_ref }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download and setup Android NDK r28b
        run: |
          NDK_URL="https://dl.google.com/android/repository/android-ndk-r28b-linux.zip"
          echo "Downloading NDK r28b..."
          curl -sL "$NDK_URL" -o ndk.zip
          echo "Extracting NDK..."
          unzip -q -o ndk.zip -d $HOME/ndk
          NDK_PATH="$HOME/ndk/android-ndk-r28b"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK installed at: $NDK_PATH"
          ls -la $NDK_PATH

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            pkg-config \
            curl \
            git \
            nasm \
            cmake \
            texinfo \
            yasm \
            bison \
            autogen \
            wget \
            gettext \
            meson \
            ninja-build \
            gperf \
            groff \
            gtk-doc-tools \
            docbook-utils \
            docbook-xsl \
            libtasn1-6-dev \
            perl \
            python3

      - name: Apply x265 CMake patch (pre-download)
        run: |
          X265_PATCH="${{ github.workspace }}/patches/ffmpeg-kit-x265-cmake.patch"
          X265_CMAKE="tools/patch/cmake/x265/CMakeLists.txt"
          if [ -f "$X265_PATCH" ] && [ -f "$X265_CMAKE" ]; then
            if grep -q 'cmake_policy(SET CMP0025 OLD)' "$X265_CMAKE"; then
              echo "Applying x265 CMake patch for CMake 4.x..."
              patch -p1 --fuzz=0 < "$X265_PATCH" || exit 1
              echo "x265 patch applied successfully"
            else
              echo "x265 CMakeLists.txt already patched or different version"
            fi
          else
            echo "x265 patch or target not found, skipping"
          fi

      - name: Inject patch hook into android.sh
        run: |
          python3 << 'PYEOF'
          import sys

          android_sh = "android.sh"
          marker = "# android-ffmpeg-kit: post-download C/CMake patches (C23, CMake 4.x)"

          with open(android_sh, 'r') as f:
              content = f.read()

          if "android-ffmpeg-kit: post-download" in content:
              print("Patch hook already injected")
              sys.exit(0)

          needle = 'downloaded_library_sources "${ENABLED_LIBRARIES[@]}"\n'
          if needle not in content:
              # Try with single quotes
              needle = "downloaded_library_sources \"\${ENABLED_LIBRARIES[@]}\"\n"
              if needle not in content:
                  sys.stderr.write(f"inject: pattern not found in {android_sh}\n")
                  sys.exit(1)

          hook = marker + '''
if [[ -n "${ANDROID_PATCH_ROOT:-}" ]] && [[ -f "${ANDROID_PATCH_ROOT}/patches/android-apply-patches.sh" ]]; then
  echo "Applying Android patches..."
  ANDROID_PATCH_ROOT="${ANDROID_PATCH_ROOT}" BASEDIR="${BASEDIR}" bash "${ANDROID_PATCH_ROOT}/patches/android-apply-patches.sh" || exit 1
fi

'''

          with open(android_sh, 'w') as f:
              f.write(content.replace(needle, needle + hook, 1))

          print("Patch hook injected successfully")
          PYEOF

      - name: Run Android build (Full GPL LTS)
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT
          export ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT
          export ANDROID_NDK=$ANDROID_NDK_ROOT
          
          echo "Building with:"
          echo "  ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "  ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          
          # Run full GPL LTS build with all architectures
          ./android.sh \
            --lts \
            --full \
            --enable-gpl \
            --enable-android-media-codec \
            --enable-android-zlib \
            2>&1 | tee build.log

          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "Build failed!"
            exit 1
          fi

      - name: Print build logs on failure
        if: failure()
        run: |
          echo "=== Build Log (last 200 lines) ==="
          if [ -f build.log ]; then
            tail -n 200 build.log
          fi
          echo ""
          echo "=== FFmpeg config.log (if exists) ==="
          if [ -f ./src/ffmpeg/ffbuild/config.log ]; then
            tail -n 100 ./src/ffmpeg/ffbuild/config.log
          fi

      - name: Verify AAR output
        run: |
          AAR_PATH="prebuilt/bundle-android-aar/ffmpeg-kit/ffmpeg-kit.aar"
          if [ -f "$AAR_PATH" ]; then
            echo "AAR found: $AAR_PATH"
            ls -lh "$AAR_PATH"
          else
            echo "AAR not found at expected path: $AAR_PATH"
            echo "Searching for AAR files..."
            find . -name "*.aar" -type f 2>/dev/null
            exit 1
          fi

      - name: Rename AAR for release
        run: |
          mkdir -p release-assets
          SOURCE_AAR="prebuilt/bundle-android-aar/ffmpeg-kit/ffmpeg-kit.aar"
          DEST_AAR="release-assets/ffmpeg-kit-full-gpl-lts-${{ inputs.tag }}.aar"
          cp "$SOURCE_AAR" "$DEST_AAR"
          echo "AAR ready for release: $DEST_AAR"
          ls -lh "$DEST_AAR"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.tag }}
          name: FFmpegKit Android ${{ inputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.aar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ inputs.tag }}
          path: |
            build.log
            src/ffmpeg/ffbuild/config.log
          if-no-files-found: ignore
