name: Publish Android AAR (full GPL LTS)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Git tag for the GitHub Release (e.g. v6.0.0-full-gpl-lts). Leave empty to upload an artifact only.'
        required: false
        type: string

concurrency:
  group: publish-android-aar-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PATCH_ROOT: ${{ github.workspace }}
  ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk

jobs:
  build-and-publish:
    name: Build and publish ffmpeg-kit AAR
    runs-on: ubuntu-22.04
    timeout-minutes: 720
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config curl git nasm cmake \
            texinfo yasm bison autogen wget gettext meson ninja-build \
            gperf groff gtk-doc-tools docbook-utils docbook-xsl \
            libtasn1-6-dev perl python3 unzip

      - name: Install Android command-line tools and SDK components
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT}"
          mkdir -p "${SDK_ROOT}/cmdline-tools"
          CL_TOOLS_ZIP="/tmp/commandlinetools.zip"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "${CL_TOOLS_ZIP}"
          unzip -q -o "${CL_TOOLS_ZIP}" -d /tmp/android-clt
          mv /tmp/android-clt/cmdline-tools "${SDK_ROOT}/cmdline-tools/latest"
          SDKM="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKM}" --sdk_root="${SDK_ROOT}" --licenses >/dev/null
          "${SDKM}" --sdk_root="${SDK_ROOT}" --install \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"

      - name: Install Android NDK r28b
        run: |
          set -euo pipefail
          curl -fsSL "https://dl.google.com/android/repository/android-ndk-r28b-linux.zip" -o /tmp/ndk.zip
          unzip -q -o /tmp/ndk.zip -d "${HOME}/ndk"
          echo "ANDROID_NDK_ROOT=${HOME}/ndk/android-ndk-r28b" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${HOME}/ndk/android-ndk-r28b" >> "$GITHUB_ENV"

      - name: Match Gradle ndkVersion to installed NDK
        run: |
          set -euo pipefail
          NDK_ROOT="${ANDROID_NDK_ROOT:-${HOME}/ndk/android-ndk-r28b}"
          REV="$(grep -E '^Revision' "${NDK_ROOT}/source.properties" | cut -d= -f2 | tr -d ' ')"
          sed -i "s/ndkVersion \"[^\"]*\"/ndkVersion \"${REV}\"/" tools/android/build.lts.gradle

      - name: Build full GPL LTS AAR
        run: |
          set -euo pipefail
          chmod +x ./android.sh
          ./android.sh -d --lts --full --enable-gpl \
            --enable-android-media-codec --enable-android-zlib

      - name: Stage release asset
        id: stage
        run: |
          set -euo pipefail
          AAR_PATH="$(find prebuilt -type f -name 'ffmpeg-kit.aar' -print -quit)"
          if [[ -z "${AAR_PATH}" ]] || [[ ! -f "${AAR_PATH}" ]]; then
            echo "ERROR: ffmpeg-kit.aar not found under prebuilt/" >&2
            exit 1
          fi
          mkdir -p release-assets
          DEST="release-assets/ffmpeg-kit-full-gpl-lts-${{ github.run_number }}-${{ github.sha }}.aar"
          cp "${AAR_PATH}" "${DEST}"
          echo "aar_path=${DEST}" >> "$GITHUB_OUTPUT"
          ls -lh release-assets/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-kit-full-gpl-lts-aar-${{ github.run_number }}
          path: release-assets/*.aar
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: FFmpegKit Android ${{ github.event.inputs.release_tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*.aar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build logs (on failure or always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            build.log
            src/ffmpeg/ffbuild/config.log
          if-no-files-found: ignore
